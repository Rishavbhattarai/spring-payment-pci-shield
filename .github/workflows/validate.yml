name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (scanner, hook and MCP tool logic)
        run: python3 -m unittest discover -s tests -v

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Validate plugin manifest (strict)
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: Validate marketplace manifest (strict)
        run: claude plugin validate . --strict

      - name: Check the hook scanner is stdlib-only and makes no network calls
        run: |
          if grep -nE '^\s*(import|from)\s+(requests|urllib3|httpx|aiohttp)\b|urllib\.request|socket\.|http\.client' scripts/pci_shield.py; then
            echo "Network or third-party import found in scripts/pci_shield.py" >&2
            exit 1
          fi
